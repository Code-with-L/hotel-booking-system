# nginx vhost for the Stillhouse SPA on Render (staging first: staging.<domain>).
# Listens on port 10000 (Render's default expected port for web services; bound to 0.0.0.0).
# /api proxies to the PRIVATE Render API service via the private network hostname,
# injected at container start from the API_INTERNAL_HOST environment variable
# (set in the Render dashboard for the web service; = the internal address shown
# on the API service's Connect tab, e.g. "stillhouse-api-abc123:4000"; protocol prefix NOT needed - nginx adds http://).
# envsubst is limited to API_INTERNAL_HOST by NGINX_ENVSUBST_FILTER (set in Render env),
# so runtime nginx variables ($host, $uri, ...) are left untouched. If you build the
# plain conf variant instead, rename this file per the Dockerfile arg docs.
server {
    listen 10000 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (unchanged from nginx.conf; CSP tightened post-photography)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Static assets: long cache with immutable fingerprints
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API reverse proxy (same-origin; cookies never cross domains).
    # Upstream is envsubst'd at container start. API_INTERNAL_HOST must be a full
    # upstream origin — e.g. "http://stillhouse-api-abc123:4000" (prefix http:// if the
    # internal address on the API service's Connect tab shows a bare host:port, e.g. "stillhouse-api-abc123:4000").
    location /api/ {
        proxy_pass ${API_INTERNAL_HOST};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # SPA fallback for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Container health probe for Render (public path) - no app dependency
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
