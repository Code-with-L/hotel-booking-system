# THE STILLHOUSE — CI/CD pipeline.
# Gates every push/PR on: install, audit, schema validate, API tests (real PostgreSQL 16),
# production build, Playwright e2e, Docker image builds and Trivy vulnerability scan.
# Deployment to staging is MANUAL (workflow_dispatch) and only runs when the repo variable
# STAGING_DEPLOY_ENABLED is set to 'true' — or performs build+push only as a dry run.
# Secrets live in GitHub Actions secrets / the host's env — never in this file.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: 'Deploy the built images to the staging host (requires STAGING_* secrets and STAGING_DEPLOY_ENABLED=true)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  verify:
    name: Verify — install, audit, test, build, e2e, docker
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stillhouse
          POSTGRES_PASSWORD: stillhouse_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stillhouse -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # matches the production images
          cache: npm

      - name: Install (lockfile-pinned)
        run: npm ci

      - name: Dependency audit — dev-chain informational (never blocks)
        run: npm audit || true

      - name: Dependency audit — critical severity (blocks the pipeline)
        run: npm audit --audit-level=critical

      - name: Prisma schema validate
        run: npx prisma validate

      - name: API tests (real PostgreSQL 16)
        run: npm test --workspace=@stillhouse/api
        env:
          TEST_DATABASE_URL: postgresql://stillhouse:stillhouse_ci_password@localhost:5432/stillhouse_test?schema=public
          TEST_ADMIN_DATABASE_URL: postgresql://stillhouse:stillhouse_ci_password@localhost:5432/postgres?schema=public

      - name: Production build (web + api)
        run: npm run build

      - name: Playwright — install browser
        run: npx playwright install --with-deps chromium

      - name: E2E database — create and migrate stillhouse_e2e
        env:
          PGPASSWORD: stillhouse_ci_password
          DATABASE_URL: postgresql://stillhouse:stillhouse_ci_password@localhost:5432/stillhouse_e2e?schema=public
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -U stillhouse -d postgres -c 'CREATE DATABASE stillhouse_e2e'
          npx prisma migrate deploy
          node prisma/seed.js

      - name: E2E — guest journey, failure path, admin RBAC
        run: npx playwright test
        env:
          DATABASE_URL: postgresql://stillhouse:stillhouse_ci_password@localhost:5432/stillhouse_e2e?schema=public
          SESSION_SECRET: ci-session-secret-not-for-production-use-0123456789abcdef
          WEB_ORIGIN: http://localhost:5173

      - name: Build production images
        run: |
          docker build -f apps/api/Dockerfile -t stillhouse-api:ci .
          docker build -f apps/web/Dockerfile -t stillhouse-web:ci .

      - name: Trivy — API image (CRITICAL, HIGH; blocks on fixable issues)
        uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: stillhouse-api:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Trivy — web image (CRITICAL, HIGH; blocks on fixable issues)
        uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: stillhouse-web:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  staging:
    name: Staging deploy (manual; owner-gated)
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Build and push images to GHCR
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -f apps/api/Dockerfile -t "ghcr.io/${{ github.repository }}/stillhouse-api:${{ github.sha }}" -t "ghcr.io/${{ github.repository }}/stillhouse-api:staging" .
          docker build -f apps/web/Dockerfile -t "ghcr.io/${{ github.repository }}/stillhouse-web:${{ github.sha }}" -t "ghcr.io/${{ github.repository }}/stillhouse-web:staging" .
          if [ "${{ vars.STAGING_DEPLOY_ENABLED }}" = "true" ]; then
            docker push "ghcr.io/${{ github.repository }}/stillhouse-api:${{ github.sha }}"
            docker push "ghcr.io/${{ github.repository }}/stillhouse-api:staging"
            docker push "ghcr.io/${{ github.repository }}/stillhouse-web:${{ github.sha }}"
            docker push "ghcr.io/${{ github.repository }}/stillhouse-web:staging"
          else
            echo "STAGING_DEPLOY_ENABLED != 'true' — building but NOT pushing. Set the repo variable to push images."
          fi

      - name: Deploy to staging host (SSH)
        if: ${{ vars.STAGING_DEPLOY_ENABLED == 'true' }}
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT || '22' }}
          STAGING_APP_DIR: ${{ secrets.STAGING_APP_DIR || '/opt/stillhouse' }}
          STAGING_WEB_ORIGIN: ${{ secrets.STAGING_WEB_ORIGIN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_deploy
          chmod 600 ~/.ssh/staging_deploy
          ssh-keyscan -p "$STAGING_SSH_PORT" "$STAGING_SSH_HOST" >> ~/.ssh/known_hosts
          # Pull fresh images on the host, apply migrations BEFORE rolling the API (additive-only), then restart
          ssh -p "$STAGING_SSH_PORT" -i ~/.ssh/staging_deploy "$STAGING_SSH_USER@$STAGING_SSH_HOST" bash -s <<EOF
            set -euo pipefail
            cd "$STAGING_APP_DIR"
            echo '${{ github.sha }}' > .deployed-sha
            docker compose pull db || true
            docker compose -f docker-compose.staging.yml --env-file .env.staging -p stillhouse-staging pull
            docker compose -f docker-compose.staging.yml --env-file .env.staging -p stillhouse-staging run --rm migrate
            docker compose -f docker-compose.staging.yml --env-file .env.staging -p stillhouse-staging up -d api web
            # Post-deploy health gate: poll /api/v1/ready until 200 (bounded ~3 minutes)
            for i in \$(seq 1 36); do
              code=\$(docker exec stillhouse-staging-api-1 wget -qO- http://127.0.0.1:4000/api/v1/ready 2>/dev/null | grep -o '"ok":true' || true)
              if [ -n "\$code" ]; then echo 'staging healthy'; exit 0; fi
              sleep 5
            done
            echo 'staging health gate FAILED - rolling back to previous images' >&2
            docker compose -f docker-compose.staging.yml --env-file .env.staging -p stillhouse-staging down || true
            exit 1
          EOF

      - name: Staging smoke check
        if: ${{ vars.STAGING_DEPLOY_ENABLED == 'true' }}
        env:
          STAGING_WEB_ORIGIN: ${{ secrets.STAGING_WEB_ORIGIN }}
        run: |
          echo "Post-deploy smoke: https://${STAGING_WEB_ORIGIN}/api/v1/ready must return ok"
          for i in $(seq 1 24); do
            if curl -fsS --max-time 5 "https://${STAGING_WEB_ORIGIN}/api/v1/ready" | grep -q '"ok":true'; then
              echo 'smoke check passed'; exit 0
            fi
            sleep 5
          done
          echo 'smoke check FAILED' >&2; exit 1
